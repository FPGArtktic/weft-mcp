# SPDX-License-Identifier: GPL-3.0-only
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weft"
version = "0.3.0"
description = "WEFT Elaborates FPGA Toolchains - an MCP server for the Intel Quartus Prime flow"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Mateusz Okulanis", email = "FPGArtktic@outlook.com" }]

dependencies = [
    # The official MCP Python SDK (FastMCP). MIT.
    "mcp>=2.0.0",
    # Vector store for document retrieval. Dual MIT/Apache-2.0; MIT is taken.
    # Ships a prebuilt SQLite extension and pulls in nothing else.
    "sqlite-vec>=0.1.9",
    # Runs BGE-M3 without torch. MIT. See PROJECT.md 5.3 for why not
    # FlagEmbedding, which is also MIT but arrives with half an ML stack.
    "onnxruntime>=1.20",
    # Required by onnxruntime, and used directly to normalise embeddings.
    "numpy>=1.26",
    # BGE-M3's tokenizer. Apache-2.0, which GPLv3 accepts and GPLv2 did not.
    "tokenizers>=0.20",
]

[project.urls]
Homepage = "https://fpgartktic.github.io/about/"
Repository = "https://github.com/FPGArtktic/weft-mcp"
Issues = "https://github.com/FPGArtktic/weft-mcp/issues"

[project.scripts]
weft = "weft.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET"]
