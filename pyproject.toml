# SPDX-License-Identifier: GPL-3.0-only
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weft"
dynamic = ["version"]
description = "WEFT Elaborates FPGA Toolchains - an MCP server for the Intel Quartus Prime flow"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Mateusz Okulanis", email = "FPGArtktic@outlook.com" }]

dependencies = [
    # The official MCP Python SDK (FastMCP). MIT.
    "mcp>=2.0.0",
    # Vector store for document retrieval. Dual MIT/Apache-2.0; MIT is taken.
    # Ships a prebuilt SQLite extension and pulls in nothing else.
    "sqlite-vec>=0.1.9",
    # Runs BGE-M3 without torch. MIT. See PROJECT.md 5.3 for why not
    # FlagEmbedding, which is also MIT but arrives with half an ML stack.
    "onnxruntime>=1.20",
    # Required by onnxruntime, and used directly to normalise embeddings.
    "numpy>=1.26",
    # BGE-M3's tokenizer. Apache-2.0, which GPLv3 accepts and GPLv2 did not.
    "tokenizers>=0.20",
]

[project.urls]
Homepage = "https://fpgartktic.github.io/about/"
Repository = "https://github.com/FPGArtktic/weft-mcp"
Issues = "https://github.com/FPGArtktic/weft-mcp/issues"

[project.scripts]
weft = "weft.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

# Documentation build, used by Read the Docs and by `sphinx-build Documentation`.
# None of it is needed to run the server.
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8",
    "sphinx-copybutton>=0.5",
    # Grids and cards, so a landing page is a way in rather than a wall of
    # prose with a table of contents under it. MIT.
    "sphinx-design>=0.6",
    "linkify-it-py>=2",
]

[tool.setuptools.dynamic]
version = { attr = "weft.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The floor pyproject requires. Without this ruff checks against whatever
# interpreter it happens to run on, and would pass syntax the oldest
# supported Python rejects.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RET"]
