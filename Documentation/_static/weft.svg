<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WEFT">
  <title>WEFT</title>
  <!-- The warp: threads held under tension on the loom. -->
  <g stroke="#4a5568" stroke-width="5" stroke-linecap="round">
    <line x1="14" y1="6" x2="14" y2="58"/>
    <line x1="32" y1="6" x2="32" y2="58"/>
    <line x1="50" y1="6" x2="50" y2="58"/>
  </g>
  <!-- The weft: the thread woven across, which is what makes fabric. -->
  <g stroke="#c2703a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M6 18 Q14 10 23 18 Q32 26 41 18 Q50 10 58 18"/>
    <path d="M6 32 Q14 24 23 32 Q32 40 41 32 Q50 24 58 32"/>
    <path d="M6 46 Q14 38 23 46 Q32 54 41 46 Q50 38 58 46"/>
  </g>
</svg>
